services:
  - type: web
    name: mirsad-live
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Live-only: set to "true" only if you want the synthetic demo feed.
      - key: DEMO_FALLBACK
        value: "false"
      - key: DEMO_FPS
        value: "8"
      - key: JPEG_QUALITY
        value: "80"
      - key: FRAME_WIDTH
        value: "320"
      - key: FRAME_HEIGHT
        value: "240"
      - key: FRAME_FORMAT
        value: rgb565be
      - key: MAX_FRAME_BYTES
        value: "2097152"
      - key: FRAME_STALE_MS
        value: "5000"
      - key: MAX_WEBRTC_PEERS
        value: "4"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TRUST_PROXY
        value: "true"
      # Render generates a random token. Copy it into the ESP32 sketch as
      # UPLOAD_TOKEN so only your camera can post frames.
      - key: UPLOAD_TOKEN
        generateValue: true
      # TURN (Metered) is optional. Add METERED_DOMAIN, METERED_API_KEY and
      # METERED_REGION later in Dashboard → Environment if you need TURN.
